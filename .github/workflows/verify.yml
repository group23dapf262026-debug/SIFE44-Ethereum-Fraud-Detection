name: Verify research artifact

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analysis-and-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python code/verify_repository.py
      - run: python code/analysis/reproduce_tables.py
      - run: python -m unittest discover -s tests -p test_features.py -v
        working-directory: code/experiments/main
